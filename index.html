<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Бюджет свадьбы</title>
<meta name="description" content="Планирование бюджета свадьбы: план, факт, авансы и оплаты">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💍</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf7f2; --card:#ffffff; --ink:#2b2420; --muted:#8a7f76; --line:#ece4da;
  --accent:#b0895b; --accent-soft:#f4ebdf;
  --ok:#3f8a5a; --ok-soft:#e5f2e9; --warn:#c07a1f; --warn-soft:#fbf0de;
  --bad:#b8483e; --bad-soft:#f8e6e3; --neutral-soft:#f1eeea;
  --radius:14px; --shadow:0 1px 2px rgba(60,40,20,.05),0 4px 16px rgba(60,40,20,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1816; --card:#24201d; --ink:#f1ebe4; --muted:#a3988e; --line:#3a332e;
    --accent:#d4ac7c; --accent-soft:#3a2f24;
    --ok:#7cc496; --ok-soft:#203328; --warn:#e5a65a; --warn-soft:#3a2d1b;
    --bad:#e98a80; --bad-soft:#3d2421; --neutral-soft:#2e2926;
    --shadow:none;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 80px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px}
h1{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:40px;line-height:1;margin:0}
h1 small{display:block;font-family:Inter,sans-serif;font-size:13px;color:var(--muted);font-weight:400;margin-top:8px;letter-spacing:.02em}
h2{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:26px;margin:0}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px}

.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:22px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.bar{height:8px;background:var(--neutral-soft);border-radius:99px;overflow:hidden;margin:6px 0 24px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.legend{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}

.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center}
.filters input,.filters select{font:inherit;font-size:14px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.filters input{flex:1;min-width:180px}

.event{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:20px;box-shadow:var(--shadow);overflow:hidden}
.event-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.event-sum{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.event-sum b{color:var(--ink);font-weight:600}
.row{display:grid;grid-template-columns:minmax(180px,2.2fr) repeat(4,minmax(90px,1fr)) 120px;gap:10px;align-items:center;padding:11px 18px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:var(--accent-soft)}
.row.th{cursor:default;background:transparent;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding-top:9px;padding-bottom:9px}
.row.th:hover{background:transparent}
.num{text-align:right;font-variant-numeric:tabular-nums}
.name{display:flex;gap:8px;align-items:center;min-width:0}
.name .t{overflow:hidden;text-overflow:ellipsis}
.name .note{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.diff-up{color:var(--bad)} .diff-down{color:var(--ok)}
.chip{display:inline-block;font-size:12px;padding:3px 9px;border-radius:99px;white-space:nowrap;text-align:center}
.chip.planned{background:var(--neutral-soft);color:var(--muted)}
.chip.advance{background:var(--warn-soft);color:var(--warn)}
.chip.closed{background:var(--ok-soft);color:var(--ok)}
.empty{padding:18px;color:var(--muted);font-size:14px}
.ml{font-size:11px;color:var(--muted);display:none}

@media (max-width:820px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .kpis .kpi:first-child{grid-column:span 2}
  .row.th{display:none}
  .row{grid-template-columns:1fr 1fr;gap:4px 12px;padding:12px 16px}
  .row .name{grid-column:1 / -1}
  .row .status{grid-column:1 / -1;text-align:left}
  .num{text-align:left}
  .ml{display:block}
  h1{font-size:32px}
}

dialog{border:0;border-radius:18px;padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 32px);background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(30,20,10,.45)}
.dlg{padding:20px 22px}
.dlg h3{margin:0 0 14px;font-family:"Cormorant Garamond",serif;font-size:26px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label.f{display:block;font-size:12px;color:var(--muted);margin-bottom:12px}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:4px;font:inherit;font-size:15px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
label.f textarea{resize:vertical;min-height:54px}
.check{display:flex;align-items:center;gap:8px;font-size:14px;margin:4px 0 14px}
.pays{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:14px}
.pays-h{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:6px}
.pay{display:grid;grid-template-columns:130px 1fr 1.3fr 28px;gap:6px;margin-bottom:6px}
.pay input{font:inherit;font-size:14px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0}
.pay button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px}
.dlg-foot{display:flex;justify-content:space-between;gap:8px;margin-top:6px}
.hint{font-size:12px;color:var(--muted);margin:-4px 0 12px}
@media (max-width:520px){.pay{grid-template-columns:1fr 1fr 28px}.pay .pn{grid-column:1 / 3}.grid2{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
footer{font-size:12px;color:var(--muted);margin-top:30px;line-height:1.6}
@media print{.toolbar,.filters,.btn{display:none!important}body{background:#fff}.event,.kpi{box-shadow:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Бюджет свадьбы<small>План · факт · авансы · оплаты</small></h1>
    <div class="toolbar">
      <button class="btn primary" id="addItem">+ Затрата</button>
      <button class="btn" id="addEvent">+ Мероприятие</button>
      <button class="btn" id="exportJson">Экспорт</button>
      <button class="btn" id="importJson">Импорт</button>
      <button class="btn" id="exportCsv">CSV</button>
      <input type="file" id="fileIn" accept="application/json" hidden>
    </div>
  </header>

  <section class="kpis" id="kpis"></section>
  <div class="legend"><span id="paidPct"></span><span id="closedCnt"></span></div>
  <div class="bar"><i id="paidBar"></i></div>

  <div class="filters">
    <input type="search" id="q" placeholder="Поиск по названию или заметке…">
    <select id="fStatus">
      <option value="">Все статусы</option>
      <option value="planned">Запланировано</option>
      <option value="advance">Аванс внесён</option>
      <option value="closed">Закрыто</option>
    </select>
  </div>

  <main id="events"></main>

  <footer>
    Данные хранятся в этом браузере. Чтобы перенести их на другой телефон или компьютер — «Экспорт» здесь и «Импорт» там.
    <br><button class="btn sm danger" id="reset" style="margin-top:8px">Сбросить к исходному плану</button>
  </footer>
</div>

<dialog id="dlg"><form method="dialog" class="dlg" id="form">
  <h3 id="dlgTitle">Затрата</h3>
  <div class="grid2">
    <label class="f">Мероприятие<select name="event" id="fEvent"></select></label>
    <label class="f">Эмодзи<input name="emoji" maxlength="4" placeholder="🎁"></label>
  </div>
  <label class="f">Название<input name="name" required></label>
  <div class="grid2">
    <label class="f">План, ₸<input name="planned" inputmode="numeric"></label>
    <label class="f">Факт (итоговая стоимость), ₸<input name="actual" inputmode="numeric" placeholder="по договору"></label>
  </div>
  <div class="pays">
    <div class="pays-h"><span>Оплаты и авансы</span><button type="button" class="btn sm" id="addPay">+ Платёж</button></div>
    <div id="payList"></div>
    <div class="hint" id="payHint"></div>
  </div>
  <label class="check"><input type="checkbox" name="closed"> Затрата закрыта (полностью рассчитались)</label>
  <label class="f">Заметка<textarea name="note" placeholder="Контакт, условия, что осталось…"></textarea></label>
  <div class="dlg-foot">
    <button type="button" class="btn danger" id="delItem">Удалить</button>
    <div style="display:flex;gap:8px">
      <button type="button" class="btn" id="cancel">Отмена</button>
      <button type="submit" class="btn primary">Сохранить</button>
    </div>
  </div>
</form></dialog>

<div class="toast" id="toast"></div>

<script>
const KEY = 'wedding-budget-v1';
const DEFAULT = {
  events: [
    { id: 'syrga', name: '💍 Сырға салу' },
    { id: 'wedding', name: '💒 Свадьба' }
  ],
  items: [
    ['wedding','🍽️','Ресторан',4050000],
    ['wedding','🥂','Фуршет + баннер',100000],
    ['wedding','🎤','Ведущий',400000],
    ['wedding','👰','Выход невесты',300000],
    ['wedding','🍾','Алкоголь',400000],
    ['wedding','📸','Фото + видео',500000],
    ['wedding','🎁','Подарки',2000000],
    ['wedding','🧸','Игрушки',300000],
    ['wedding','👗','Свадебный наряд невесты',1200000],
    ['wedding','🤵','Костюм жениха',400000],
    ['wedding','💍','Кольца',100000],
    ['wedding','👨‍👩‍👧','Наряды родителей',400000],
    ['wedding','💄','Макияж дополнительных лиц',150000],
    ['wedding','💄','Макияж невесты',200000],
    ['wedding','🍽️','Дастархан',1000000],
    ['wedding','🍽️','Дәм',300000],
    ['wedding','🧶','Ковер для родителей',200000],
    ['wedding','🧶','Ковер для нағашы',150000],
    ['syrga','🧶','Ковер',300000],
    ['syrga','🐎','Қалың мал',1100000],
    ['syrga','🎁','Подарки семье невесты',600000],
    ['syrga','🍽️','«Дәм»',500000],
    ['syrga','🫖','Шай',50000],
    ['syrga','🥩','Ет',20000],
    ['syrga','💵','Карманные',100000],
    ['syrga','🍽️','Дастархан',150000]
  ].map(([event,emoji,name,planned],i)=>({id:'i'+i,event,emoji,name,planned,actual:null,payments:[],closed:false,note:''}))
};

const uid = () => Math.random().toString(36).slice(2,10);
const clone = o => JSON.parse(JSON.stringify(o));
let state;
function load(){
  try { const s = localStorage.getItem(KEY); state = s ? JSON.parse(s) : clone(DEFAULT); }
  catch(e){ state = clone(DEFAULT); }
  // разовый перенос: сырға салу показываем первым
  if(!state.syrgaFirst){
    const i = state.events.findIndex(e=>e.id==='syrga');
    if(i>0) state.events.unshift(...state.events.splice(i,1));
    state.syrgaFirst = true; save();
  }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

const fmt = n => (Math.round(n)||0).toLocaleString('ru-RU').replace(/,/g,' ') + ' ₸';
const parseNum = v => { const s = String(v??'').replace(/[^\d-]/g,''); return s===''?null:Number(s); };
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const paid = it => it.payments.reduce((a,p)=>a+(Number(p.amount)||0),0);
const cost = it => it.actual ?? it.planned ?? 0;          // сколько в итоге стоит
const left = it => it.closed ? 0 : Math.max(cost(it) - paid(it), 0);
const status = it => it.closed ? 'closed' : paid(it) > 0 ? 'advance' : 'planned';
const STATUS = { planned:'Запланировано', advance:'Аванс внесён', closed:'Закрыто' };

function totals(items){
  return items.reduce((t,it)=>{
    t.planned += it.planned||0; t.cost += cost(it); t.paid += paid(it); t.left += left(it);
    if(it.actual!=null) t.diff += it.actual - (it.planned||0);
    if(it.closed) t.closed++;
    return t;
  },{planned:0,cost:0,paid:0,left:0,diff:0,closed:0});
}

function render(){
  const T = totals(state.items);
  const diffCls = T.diff>0?'diff-up':T.diff<0?'diff-down':'';
  document.getElementById('kpis').innerHTML = `
    <div class="kpi"><div class="l">Запланировано</div><div class="v">${fmt(T.planned)}</div><div class="s">${state.items.length} статей</div></div>
    <div class="kpi"><div class="l">Ожидаемо в итоге</div><div class="v">${fmt(T.cost)}</div><div class="s">факт, где известен, иначе план</div></div>
    <div class="kpi"><div class="l">Оплачено</div><div class="v">${fmt(T.paid)}</div><div class="s">авансы и оплаты</div></div>
    <div class="kpi"><div class="l">Осталось оплатить</div><div class="v">${fmt(T.left)}</div><div class="s">по незакрытым</div></div>
    <div class="kpi"><div class="l">Отклонение от плана</div><div class="v ${diffCls}">${T.diff>0?'+':''}${fmt(T.diff)}</div><div class="s">${T.diff>0?'перерасход':T.diff<0?'экономия':'пока без отклонений'}</div></div>`;
  const pct = T.cost ? Math.min(100, T.paid/T.cost*100) : 0;
  document.getElementById('paidBar').style.width = pct+'%';
  document.getElementById('paidPct').textContent = `Оплачено ${pct.toFixed(0)}% от ожидаемой суммы`;
  document.getElementById('closedCnt').textContent = `Закрыто ${T.closed} из ${state.items.length}`;

  const q = document.getElementById('q').value.trim().toLowerCase();
  const fs = document.getElementById('fStatus').value;
  const match = it => (!fs || status(it)===fs) && (!q || (it.name+' '+it.note).toLowerCase().includes(q));

  document.getElementById('events').innerHTML = state.events.map(ev=>{
    const all = state.items.filter(i=>i.event===ev.id);
    const list = all.filter(match);
    const t = totals(all);
    const rows = list.map(it=>{
      const d = it.actual!=null ? it.actual-(it.planned||0) : null;
      const st = status(it);
      return `<div class="row" data-id="${it.id}">
        <div class="name"><span>${esc(it.emoji)}</span><span class="t">${esc(it.name)}${it.note?`<span class="note">${esc(it.note)}</span>`:''}</span></div>
        <div class="num"><span class="ml">План</span>${fmt(it.planned)}</div>
        <div class="num"><span class="ml">Факт</span>${it.actual!=null?fmt(it.actual)+(d?` <small class="${d>0?'diff-up':'diff-down'}">${d>0?'+':'−'}${fmt(Math.abs(d)).replace(' ₸','')}</small>`:''):'<span style="color:var(--muted)">—</span>'}</div>
        <div class="num"><span class="ml">Оплачено</span>${fmt(paid(it))}</div>
        <div class="num"><span class="ml">Осталось</span>${fmt(left(it))}</div>
        <div class="status" style="text-align:right"><span class="chip ${st}">${STATUS[st]}</span></div>
      </div>`;
    }).join('');
    return `<section class="event">
      <div class="event-head">
        <h2>${esc(ev.name)}</h2>
        <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
          <div class="event-sum">План <b>${fmt(t.planned)}</b> · Оплачено <b>${fmt(t.paid)}</b> · Осталось <b>${fmt(t.left)}</b></div>
          <button class="btn sm" data-add="${ev.id}">+ Затрата</button>
          <button class="btn sm" data-ren="${ev.id}" title="Переименовать или удалить">✎</button>
        </div>
      </div>
      <div class="row th"><div>Расход</div><div class="num">План</div><div class="num">Факт</div><div class="num">Оплачено</div><div class="num">Осталось</div><div style="text-align:right">Статус</div></div>
      ${rows || `<div class="empty">${all.length?'Ничего не найдено по фильтру':'Пока нет затрат'}</div>`}
    </section>`;
  }).join('');
}

/* ---------- Dialog ---------- */
const dlg = document.getElementById('dlg'), form = document.getElementById('form');
let editing = null, draftPays = [];

function payRow(p,i){
  return `<div class="pay">
    <input type="date" value="${esc(p.date)}" data-i="${i}" data-k="date">
    <input inputmode="numeric" placeholder="Сумма" value="${p.amount?Number(p.amount).toLocaleString('ru-RU'):''}" data-i="${i}" data-k="amount">
    <input class="pn" placeholder="Комментарий (аванс, остаток…)" value="${esc(p.note)}" data-i="${i}" data-k="note">
    <button type="button" data-rm="${i}" title="Удалить">×</button></div>`;
}
function renderPays(){
  document.getElementById('payList').innerHTML = draftPays.map(payRow).join('') || '<div class="hint" style="margin:0">Платежей пока нет</div>';
  updateHint();
}
function updateHint(){
  const sum = draftPays.reduce((a,p)=>a+(Number(p.amount)||0),0);
  const c = parseNum(form.actual.value) ?? parseNum(form.planned.value) ?? 0;
  document.getElementById('payHint').textContent = draftPays.length ? `Внесено ${fmt(sum)} · осталось ${fmt(Math.max(c-sum,0))}` : '';
}
document.getElementById('payList').addEventListener('input', e=>{
  const i = e.target.dataset.i, k = e.target.dataset.k; if(i==null) return;
  draftPays[i][k] = k==='amount' ? parseNum(e.target.value) : e.target.value;
  updateHint();
});
document.getElementById('payList').addEventListener('click', e=>{
  if(e.target.dataset.rm!=null){ draftPays.splice(+e.target.dataset.rm,1); renderPays(); }
});
document.getElementById('addPay').onclick = ()=>{
  draftPays.push({date:new Date().toISOString().slice(0,10),amount:null,note:draftPays.length?'':'Аванс'}); renderPays();
  const inputs = document.querySelectorAll('#payList input[data-k="amount"]'); inputs[inputs.length-1]?.focus();
};
form.planned.addEventListener('input',updateHint); form.actual.addEventListener('input',updateHint);

function openItem(it, eventId){
  editing = it;
  document.getElementById('dlgTitle').textContent = it ? 'Изменить затрату' : 'Новая затрата';
  document.getElementById('fEvent').innerHTML = state.events.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('');
  form.event.value = it?.event ?? eventId ?? state.events[0]?.id;
  form.emoji.value = it?.emoji ?? '';
  form.name.value = it?.name ?? '';
  form.planned.value = it?.planned!=null ? it.planned.toLocaleString('ru-RU') : '';
  form.actual.value = it?.actual!=null ? it.actual.toLocaleString('ru-RU') : '';
  form.closed.checked = !!it?.closed;
  form.note.value = it?.note ?? '';
  draftPays = clone(it?.payments ?? []);
  document.getElementById('delItem').style.visibility = it ? 'visible' : 'hidden';
  renderPays(); dlg.showModal(); if(!it) form.name.focus();
}
form.addEventListener('submit', e=>{
  e.preventDefault();
  if(!state.events.length){ toast('Сначала добавьте мероприятие'); return; }
  const data = {
    event: form.event.value, emoji: form.emoji.value.trim() || '•', name: form.name.value.trim(),
    planned: parseNum(form.planned.value) ?? 0, actual: parseNum(form.actual.value),
    closed: form.closed.checked, note: form.note.value.trim(),
    payments: draftPays.filter(p=>Number(p.amount))
  };
  if(!data.name) return;
  if(editing) Object.assign(editing, data); else state.items.push({id:uid(), ...data});
  save(); render(); dlg.close(); toast('Сохранено');
});
document.getElementById('cancel').onclick = ()=>dlg.close();
document.getElementById('delItem').onclick = ()=>{
  if(editing && confirm(`Удалить «${editing.name}»?`)){
    state.items = state.items.filter(i=>i!==editing); save(); render(); dlg.close(); toast('Удалено');
  }
};

/* ---------- Main actions ---------- */
document.getElementById('events').addEventListener('click', e=>{
  const add = e.target.closest('[data-add]'), ren = e.target.closest('[data-ren]'), row = e.target.closest('.row[data-id]');
  if(add) return openItem(null, add.dataset.add);
  if(ren){
    const ev = state.events.find(x=>x.id===ren.dataset.ren);
    const n = prompt('Название мероприятия (оставьте пустым, чтобы удалить вместе с затратами):', ev.name);
    if(n===null) return;
    if(n.trim()==='') {
      if(confirm(`Удалить «${ev.name}» и все его затраты?`)){ state.events = state.events.filter(x=>x!==ev); state.items = state.items.filter(i=>i.event!==ev.id); }
    } else ev.name = n.trim();
    save(); render(); return;
  }
  if(row) openItem(state.items.find(i=>i.id===row.dataset.id));
});
document.getElementById('addItem').onclick = ()=>openItem(null);
document.getElementById('addEvent').onclick = ()=>{
  const n = prompt('Название мероприятия, например «🎉 Қыз ұзату»:'); if(!n?.trim()) return;
  state.events.push({id:uid(), name:n.trim()}); save(); render();
};
document.getElementById('q').oninput = render;
document.getElementById('fStatus').onchange = render;

function download(name, text, type){
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text],{type})); a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
const today = () => new Date().toISOString().slice(0,10);
document.getElementById('exportJson').onclick = ()=>download(`wedding-budget-${today()}.json`, JSON.stringify(state,null,2), 'application/json');
document.getElementById('importJson').onclick = ()=>document.getElementById('fileIn').click();
document.getElementById('fileIn').onchange = async e=>{
  const f = e.target.files[0]; if(!f) return;
  try{
    const d = JSON.parse(await f.text());
    if(!Array.isArray(d.events)||!Array.isArray(d.items)) throw 0;
    if(confirm('Заменить текущие данные данными из файла?')){ state = d; save(); render(); toast('Импортировано'); }
  }catch(_){ toast('Не удалось прочитать файл'); }
  e.target.value='';
};
document.getElementById('exportCsv').onclick = ()=>{
  const ev = Object.fromEntries(state.events.map(e=>[e.id,e.name]));
  const lines = [['Мероприятие','Расход','План','Факт','Оплачено','Осталось','Статус','Платежи','Заметка']];
  state.items.forEach(it=>lines.push([ev[it.event],it.name,it.planned,it.actual??'',paid(it),left(it),STATUS[status(it)],
    it.payments.map(p=>`${p.date} ${p.amount}${p.note?' ('+p.note+')':''}`).join('; '),it.note]));
  const csv = lines.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(';')).join('\n');
  download(`wedding-budget-${today()}.csv`, '﻿'+csv, 'text/csv');
};
document.getElementById('reset').onclick = ()=>{
  if(confirm('Вернуть исходный план? Все внесённые оплаты и изменения будут удалены. Сначала лучше сделать «Экспорт».')){
    state = clone(DEFAULT); save(); render(); toast('Сброшено');
  }
};
function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),1800); }

load(); render();
</script>
</body>
</html>
